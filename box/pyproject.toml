[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-transport-box"
version = "0.1.0"
description = "Tensor-train (TT) solvers for the time-dependent neutron transport equation, 3D box geometry"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "torch",
    "torchtt",
]

[tool.setuptools.packages.find]
where = ["src"]
